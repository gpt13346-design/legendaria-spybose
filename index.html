spybose
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spybose Ultra - Versión Completa</title>
    <style>
        :root {
            --duo-green: #58cc02; --duo-blue: #1cb0f6; --duo-orange: #ff9600; 
            --duo-red: #ff4b4b; --duo-border: #e5e5e5;
        }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #fff; display: flex; flex-direction: column; align-items: center; user-select: none; }
        
        header { width: 100%; max-width: 500px; padding: 15px; border-bottom: 2px solid var(--duo-border); display: flex; justify-content: space-around; position: sticky; top: 0; background: white; z-index: 100; }
        .stat { font-weight: bold; display: flex; align-items: center; gap: 5px; }

        .container { width: 100%; max-width: 500px; padding-bottom: 100px; min-height: 90vh; }
        .screen { display: none; padding: 20px; text-align: center; animation: fadeIn 0.3s; }
        .active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* BARRAS MASCOTA */
        .status-bars { width: 90%; margin: 10px auto; background: #f9f9f9; padding: 10px; border-radius: 15px; border: 1px solid #eee; }
        .bar-row { display: flex; align-items: center; justify-content: space-between; margin: 5px 0; font-size: 0.8rem; font-weight: bold; }
        .bar-bg { width: 65%; height: 10px; background: #eee; border-radius: 5px; overflow: hidden; }
        .bar-fill { height: 100%; transition: 0.5s; width: 100%; }

        .avatar-frame { font-size: 6rem; height: 150px; display: flex; justify-content: center; align-items: center; margin: 20px auto; background: radial-gradient(circle, #f0f0f0 0%, #fff 70%); border-radius: 50%; border: 4px solid var(--duo-border); cursor: pointer; }

        /* RUTA */
        .path-map { display: flex; flex-direction: column; align-items: center; padding: 20px 0; }
        .node { width: 70px; height: 70px; border-radius: 50%; border: none; color: white; font-size: 1.5rem; cursor: pointer; margin: 12px 0; position: relative; }
        .node.completed { background: var(--duo-orange); box-shadow: 0 6px 0 #cc7a00; }
        .node.current { background: var(--duo-green); box-shadow: 0 6px 0 #46a302; }
        .node.locked { background: #e5e5e5; box-shadow: 0 6px 0 #afafaf; cursor: not-allowed; opacity: 0.6; }
        .connector { width: 10px; height: 25px; background: var(--duo-border); margin: -12px 0; }

        .btn { width: 100%; padding: 15px; margin: 10px 0; border: 2px solid var(--duo-border); border-radius: 15px; background: white; font-weight: bold; cursor: pointer; font-size: 1.1rem; }
        .btn-main { background: var(--duo-green); color: white; border: none; box-shadow: 0 5px 0 #46a302; }

        .progress-bar { width: 100%; height: 12px; background: #eee; border-radius: 10px; margin-bottom: 20px; }
        .progress-fill { height: 100%; background: var(--duo-green); width: 0%; transition: 0.3s; }

        nav { position: fixed; bottom: 0; width: 100%; max-width: 500px; background: white; border-top: 2px solid var(--duo-border); display: flex; justify-content: space-around; padding: 12px 0; }
        .nav-btn { background: none; border: none; font-size: 1.8rem; cursor: pointer; color: #ccc; }
        .nav-btn.active { color: var(--duo-blue); }
    </style>
</head>
<body>

    <header>
        <div class="stat" style="color:var(--duo-orange)">🔥 <span id="racha-val">0</span></div>
        <div class="stat" style="color:var(--duo-blue)">💎 <span id="gemas-val">0</span></div>
        <div class="stat" style="color:var(--duo-red)">❤️ <span id="vidas-val">5</span></div>
    </header>

    <div class="container">
        <div id="scr-pet" class="screen active">
            <div class="status-bars">
                <div class="bar-row"><span>🍕 Hambre</span><div class="bar-bg"><div id="bar-h" class="bar-fill" style="background:orange"></div></div></div>
                <div class="bar-row"><span>😊 Ánimo</span><div class="bar-bg"><div id="bar-a" class="bar-fill" style="background:var(--duo-green)"></div></div></div>
                <div class="bar-row"><span>🌡️ Salud</span><div class="bar-bg"><div id="bar-s" class="bar-fill" style="background:var(--duo-red)"></div></div></div>
            </div>
            <div class="avatar-frame" id="pet-display" onclick="petMascot()">🐸</div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <button class="btn" onclick="feed()">Comer (💎10)</button>
                <button class="btn" onclick="heal()">Curar (💎25)</button>
            </div>
            <button class="btn btn-main" onclick="show('scr-catalog')">IR A ESTUDIAR</button>
        </div>

        <div id="scr-catalog" class="screen">
            <h2>Elige un idioma</h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <button class="btn" onclick="selectLang('Japonés')">🇯🇵 JPN</button>
                <button class="btn" onclick="selectLang('Coreano')">🇰🇷 KOR</button>
                <button class="btn" onclick="selectLang('Inglés')">🇺🇸 ENG</button>
                <button class="btn" onclick="selectLang('Francés')">🇫🇷 FRA</button>
                <button class="btn" onclick="selectLang('Aleman')">🇩🇪 GER</button>
                <button class="btn" onclick="selectLang('Portugues')">🇧🇷 POR</button>
            </div>
        </div>

        <div id="scr-path" class="screen">
            <h2 id="path-title">Ruta</h2>
            <div id="map-nodes" class="path-map"></div>
            <button class="btn" onclick="show('scr-catalog')">Volver</button>
        </div>

        <div id="scr-game" class="screen">
            <div class="progress-bar"><div id="game-progress" class="progress-fill"></div></div>
            <h3 id="q-txt">...</h3>
            <div id="opt-box"></div>
        </div>
    </div>

    <nav>
        <button class="nav-btn active" onclick="show('scr-pet', this)">🐾</button>
        <button class="nav-btn" onclick="show('scr-catalog', this)">🏠</button>
        <button class="nav-btn" onclick="alert('Tienda en mantenimiento')">👕</button>
    </nav>

    <script>
        // --- DICCIONARIO AMPLIADO (Puedes agregar hasta 100 por idioma) ---
        const dictionary = {
            'Japonés': [{q:"Gato", a:["Neko","Inu"], c:"Neko"}, {q:"Agua", a:["Mizu","Ocha"], c:"Mizu"}, {q:"Luna", a:["Tsuki","Taiyo"], c:"Tsuki"}],
            'Coreano': [{q:"Hola", a:["Annyeong","Mul"], c:"Annyeong"}, {q:"Agua", a:["Mul","Uyu"], c:"Mul"}],
            'Inglés': [{q:"Libro", a:["Book","Pen"], c:"Book"}],
            'Francés': [{q:"Hola", a:["Bonjour","Merci"], c:"Bonjour"}],
            'Aleman': [{q:"Agua", a:["Wasser","Bier"], c:"Wasser"}],
            'Portugues': [{q:"Gracias", a:["Obrigado","Bom"], c:"Obrigado"}]
        };

        let state = {
            xp: parseInt(localStorage.getItem('sb_xp')) || 0,
            gemas: parseInt(localStorage.getItem('sb_gemas')) || 50,
            racha: parseInt(localStorage.getItem('sb_racha')) || 0,
            vidas: 5,
            hunger: 100, love: 100, health: 100,
            currentLang: "",
            progress: JSON.parse(localStorage.getItem('sb_prog_lang')) || { 'Japonés': 1, 'Coreano': 1, 'Inglés': 1, 'Francés': 1, 'Aleman': 1, 'Portugues': 1 }
        };

        let session = { currentStep: 0, totalSteps: 5 };

        // --- LÓGICA MASCOTA ---
        function updatePetUI() {
            document.getElementById('bar-h').style.width = state.hunger + "%";
            document.getElementById('bar-a').style.width = state.love + "%";
            document.getElementById('bar-s').style.width = state.health + "%";
            const pet = document.getElementById('pet-display');
            if(state.health < 30) pet.innerText = "🤒"; 
            else if(state.hunger < 30) pet.innerText = "🤤"; 
            else pet.innerText = "🐸";
        }

        setInterval(() => {
            state.hunger = Math.max(0, state.hunger - 1);
            state.love = Math.max(0, state.love - 1);
            if(state.hunger < 10) state.health = Math.max(0, state.health - 1);
            updatePetUI();
        }, 8000);

        function feed() { if(state.gemas >= 10) { state.gemas -= 10; state.hunger = 100; save(); renderUI(); } }
        function heal() { if(state.gemas >= 25) { state.gemas -= 25; state.health = 100; save(); renderUI(); } }
        function petMascot() { state.love = Math.min(100, state.love + 10); updatePetUI(); }

        // --- LÓGICA IDIOMAS ---
        function selectLang(l) { state.currentLang = l; show('scr-path'); renderPath(); }

        function renderPath() {
            const container = document.getElementById('map-nodes');
            container.innerHTML = "";
            document.getElementById('path-title').innerText = "Ruta de " + state.currentLang;
            let userLevel = state.progress[state.currentLang];
            for(let i=1; i<=5; i++) {
                const b = document.createElement('button');
                b.className = i < userLevel ? "node completed" : (i === userLevel ? "node current" : "node locked");
                b.innerText = i === 5 ? "🏆" : i;
                if(i <= userLevel) b.onclick = () => startLesson();
                container.appendChild(b);
                if(i < 5) { const c = document.createElement('div'); c.className = "connector"; container.appendChild(c); }
            }
        }

        function startLesson() {
            if(state.vidas <= 0) return alert("¡Sin vidas!");
            session.currentStep = 0;
            show('scr-game');
            nextQuestion();
        }

        function nextQuestion() {
            if(session.currentStep >= session.totalSteps) { finishLesson(); return; }
            document.getElementById('game-progress').style.width = (session.currentStep / session.totalSteps * 100) + "%";
            let words = dictionary[state.currentLang];
            let q = words[Math.floor(Math.random() * words.length)];
            document.getElementById('q-txt').innerText = "¿Traduce '" + q.q + "'?";
            const box = document.getElementById('opt-box'); box.innerHTML = "";
            q.a.forEach(opt => {
                const btn = document.createElement('button'); btn.className = "btn"; btn.innerText = opt;
                btn.onclick = () => {
                    if(opt === q.c) { session.currentStep++; nextQuestion(); }
                    else { state.vidas--; renderUI(); alert("¡Error! Vidas: " + state.vidas); if(state.vidas <= 0) show('scr-pet'); }
                };
                box.appendChild(btn);
            });
        }

        function finishLesson() {
            state.progress[state.currentLang]++;
            state.gemas += 15;
            state.racha++; // Racha simple por ahora
            save(); renderUI();
            alert("¡Lección ganada! +15 Gemas");
            show('scr-path'); renderPath();
        }

        function show(id, btn) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(btn) { document.querySelectorAll('.nav-btn').forEach(t => t.classList.remove('active')); btn.classList.add('active'); }
        }

        function save() {
            localStorage.setItem('sb_gemas', state.gemas);
            localStorage.setItem('sb_prog_lang', JSON.stringify(state.progress));
            localStorage.setItem('sb_racha', state.racha);
        }

        function renderUI() {
            document.getElementById('racha-val').innerText = state.racha;
            document.getElementById('gemas-val').innerText = state.gemas;
            document.getElementById('vidas-val').innerText = state.vidas;
            updatePetUI();
        }

        renderUI();
    </script>
</body>
</html>
