<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spybose Ultra - Idiomas Primero</title>
    <style>
        :root {
            --duo-green: #58cc02; --duo-blue: #1cb0f6; --duo-orange: #ff9600; 
            --duo-red: #ff4b4b; --duo-border: #e5e5e5;
        }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #fff; display: flex; flex-direction: column; align-items: center; user-select: none; }
        
        header { width: 100%; max-width: 500px; padding: 15px; border-bottom: 2px solid var(--duo-border); display: flex; justify-content: space-around; position: sticky; top: 0; background: white; z-index: 100; }
        .stat { font-weight: bold; display: flex; align-items: center; gap: 5px; }

        .container { width: 100%; max-width: 500px; padding-bottom: 100px; min-height: 90vh; }
        .screen { display: none; padding: 20px; text-align: center; animation: fadeIn 0.3s; }
        .active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* RUTA DE APRENDIZAJE */
        .path-map { display: flex; flex-direction: column; align-items: center; padding: 20px 0; }
        .node { width: 80px; height: 80px; border-radius: 50%; border: none; color: white; font-size: 1.8rem; cursor: pointer; margin: 15px 0; position: relative; }
        .node.completed { background: var(--duo-orange); box-shadow: 0 8px 0 #cc7a00; }
        .node.current { background: var(--duo-green); box-shadow: 0 8px 0 #46a302; }
        .node.locked { background: #e5e5e5; box-shadow: 0 8px 0 #afafaf; cursor: not-allowed; opacity: 0.6; }
        .connector { width: 12px; height: 30px; background: var(--duo-border); margin: -15px 0; }

        .btn { width: 100%; padding: 15px; margin: 10px 0; border: 2px solid var(--duo-border); border-radius: 15px; background: white; font-weight: bold; cursor: pointer; font-size: 1.1rem; }
        .btn-main { background: var(--duo-green); color: white; border: none; box-shadow: 0 5px 0 #46a302; }

        /* PROGRESO LECCIÓN */
        .progress-bar { width: 100%; height: 15px; background: #eee; border-radius: 10px; margin-bottom: 20px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--duo-green); width: 0%; transition: 0.3s; }

        nav { position: fixed; bottom: 0; width: 100%; max-width: 500px; background: white; border-top: 2px solid var(--duo-border); display: flex; justify-content: space-around; padding: 12px 0; }
        .nav-btn { background: none; border: none; font-size: 1.8rem; cursor: pointer; color: #ccc; }
        .nav-btn.active { color: var(--duo-blue); }
    </style>
</head>
<body>

    <header>
        <div class="stat" style="color:var(--duo-orange)">🔥 <span id="racha-val">0</span></div>
        <div class="stat" style="color:var(--duo-blue)">💎 <span id="gemas-val">0</span></div>
        <div class="stat" style="color:var(--duo-red)">❤️ <span id="vidas-val">5</span></div>
    </header>

    <div class="container">
        <div id="scr-catalog" class="screen active">
            <h2>¿Qué quieres aprender hoy?</h2>
            <button class="btn" onclick="selectLang('Japonés')">🇯🇵 Japonés</button>
            <button class="btn" onclick="selectLang('Coreano')">🇰🇷 Coreano</button>
            <button class="btn" onclick="selectLang('Inglés')">🇺🇸 Inglés</button>
        </div>

        <div id="scr-path" class="screen">
            <h2 id="path-title">Ruta</h2>
            <div id="map-nodes" class="path-map"></div>
            <button class="btn" onclick="show('scr-catalog')">Cambiar Idioma</button>
        </div>

        <div id="scr-game" class="screen">
            <div class="progress-bar"><div id="game-progress" class="progress-fill"></div></div>
            <h3 id="q-txt">Cargando...</h3>
            <div id="opt-box"></div>
        </div>

        <div id="scr-pet" class="screen">
            <div id="pet-display" style="font-size: 6rem; margin: 20px;">🐸</div>
            <p>¡Sigue estudiando para mantenerme feliz!</p>
            <button class="btn btn-main" onclick="show('scr-catalog')">IR A LECCIÓN</button>
        </div>
    </div>

    <nav>
        <button class="nav-btn" onclick="show('scr-pet', this)">🐾</button>
        <button class="nav-btn active" onclick="show('scr-catalog', this)">🏠</button>
        <button class="nav-btn" onclick="show('scr-shop', this)">👕</button>
    </nav>

    <script>
        // --- BANCO DE DATOS (Aquí puedes añadir las 100 palabras) ---
        const dictionary = {
            'Japonés': [
                {q:"Gato", a:["Neko", "Inu"], c:"Neko"}, {q:"Agua", a:["Mizu", "Ocha"], c:"Mizu"},
                {q:"Persona", a:["Hito", "Hon"], c:"Hito"}, {q:"Libro", a:["Hon", "Mizu"], c:"Hon"},
                {q:"Maestro", a:["Sensei", "Gakusei"], c:"Sensei"}, {q:"Estudiante", a:["Gakusei", "Sensei"], c:"Gakusei"},
                {q:"Amigo", a:["Tomodachi", "Hito"], c:"Tomodachi"}, {q:"Si", a:["Hai", "Iie"], c:"Hai"}
            ],
            'Coreano': [
                {q:"Hola", a:["Annyeong", "Mul"], c:"Annyeong"}, {q:"Agua", a:["Mul", "Uyu"], c:"Mul"},
                {q:"Leche", a:["Uyu", "Mul"], c:"Uyu"}, {q:"Amigo", a:["Chingu", "Oppa"], c:"Chingu"},
                {q:"Gracias", a:["Gomawo", "Annyeong"], c:"Gomawo"}, {q:"Si", a:["Ne", "Aniyo"], c:"Ne"}
            ],
            'Inglés': [
                {q:"Perro", a:["Dog", "Cat"], c:"Dog"}, {q:"Manzana", a:["Apple", "Pear"], c:"Apple"}
            ]
        };

        // --- ESTADO DEL JUEGO ---
        let state = {
            xp: parseInt(localStorage.getItem('sb_xp')) || 0,
            gemas: parseInt(localStorage.getItem('sb_gemas')) || 0,
            racha: parseInt(localStorage.getItem('sb_racha')) || 0,
            vidas: 5,
            lastDate: localStorage.getItem('sb_date') || "",
            currentLang: "",
            // Progreso por idioma
            progress: JSON.parse(localStorage.getItem('sb_prog_lang')) || { 'Japonés': 1, 'Coreano': 1, 'Inglés': 1 }
        };

        let session = { currentStep: 0, totalSteps: 5 };

        function selectLang(l) {
            state.currentLang = l;
            show('scr-path');
            renderPath();
        }

        function renderPath() {
            const container = document.getElementById('map-nodes');
            container.innerHTML = "";
            document.getElementById('path-title').innerText = "Curso de " + state.currentLang;
            
            let userLevel = state.progress[state.currentLang];

            for(let i=1; i<=5; i++) {
                const b = document.createElement('button');
                if(i < userLevel) b.className = "node completed";
                else if(i === userLevel) b.className = "node current";
                else b.className = "node locked";

                b.innerText = i === 5 ? "🏆" : i;
                if(i <= userLevel) b.onclick = () => startLesson();
                
                container.appendChild(b);
                if(i < 5) {
                    const c = document.createElement('div');
                    c.className = "connector";
                    container.appendChild(c);
                }
            }
        }

        function startLesson() {
            session.currentStep = 0;
            show('scr-game');
            nextQuestion();
        }

        function nextQuestion() {
            if(session.currentStep >= session.totalSteps) {
                finishLesson();
                return;
            }

            document.getElementById('game-progress').style.width = (session.currentStep / session.totalSteps * 100) + "%";
            
            let langWords = dictionary[state.currentLang];
            let q = langWords[Math.floor(Math.random() * langWords.length)];
            
            document.getElementById('q-txt').innerText = "¿Cómo se dice '" + q.q + "'?";
            const box = document.getElementById('opt-box');
            box.innerHTML = "";

            q.a.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "btn";
                btn.innerText = opt;
                btn.onclick = () => {
                    if(opt === q.c) {
                        session.currentStep++;
                        nextQuestion();
                    } else {
                        alert("¡Incorrecto! Inténtalo de nuevo.");
                        state.vidas--;
                        renderUI();
                    }
                };
                box.appendChild(btn);
            });
        }

        function finishLesson() {
            // Actualizar racha solo si es un nuevo día
            let hoy = new Date().toLocaleDateString();
            if(state.lastDate !== hoy) {
                state.racha++;
                state.lastDate = hoy;
                localStorage.setItem('sb_racha', state.racha);
                localStorage.setItem('sb_date', hoy);
            }

            // Subir nivel solo del idioma actual
            state.progress[state.currentLang]++;
            state.gemas += 10;
            
            localStorage.setItem('sb_prog_lang', JSON.stringify(state.progress));
            localStorage.setItem('sb_gemas', state.gemas);
            
            alert("¡Lección completada! Racha: " + state.racha);
            renderUI();
            show('scr-path');
            renderPath();
        }

        function show(id, btn) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(btn) {
                document.querySelectorAll('.nav-btn').forEach(t => t.classList.remove('active'));
                btn.classList.add('active');
            }
        }

        function renderUI() {
            document.getElementById('racha-val').innerText = state.racha;
            document.getElementById('gemas-val').innerText = state.gemas;
            document.getElementById('vidas-val').innerText = state.vidas;
        }

        renderUI();
    </script>
</body>
</html>
